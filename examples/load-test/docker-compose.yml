# Two wallet servers on one Postgres database behind an nginx ingress. The
# target for load and performance tests: every request through the ingress
# lands on either server, and both serve the same wallet state.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  wallet-1: &wallet
    image: ghcr.io/dominikschlosser/eudi-dev:${WALLET_TAG:-latest}
    # docker compose build builds the image from the working tree.
    build:
      context: ../..
    # The state persists in the database, so the wallet generates its own random keys.
    environment:
      EUDI_DEV_STORAGE: postgres://postgres:wallet@db:5432/wallet?sslmode=disable
      EUDI_DEV_SEED: ""
    # The load generator's verifier callback runs on this machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/"]
      interval: 2s
      timeout: 3s
      retries: 30
    # The base URL is the ingress as a verifier or issuer on the host sees
    # it. The HTTPS issuer endpoints take its host and the wallet port plus
    # one (8086). The ingress passes that port through unchanged.
    command:
      - wallet
      - serve
      - --auto-accept
      - --pid
      - --port
      - "8085"
      - --base-url
      - http://localhost:${INGRESS_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy

  # The second server starts after the first is healthy, so only one of them
  # generates the PID baseline.
  wallet-2:
    <<: *wallet
    depends_on:
      db:
        condition: service_healthy
      wallet-1:
        condition: service_healthy

  ingress:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # INGRESS_PORT moves the HTTP host port. The HTTPS host port has to stay
    # 8086, the port the wallets advertise.
    ports:
      - "${INGRESS_PORT:-8080}:8080"
      - "8086:8081"
    # The ingress opens once both servers answer, so no request meets a
    # server that is still starting.
    depends_on:
      wallet-1:
        condition: service_healthy
      wallet-2:
        condition: service_healthy
