# One worker keeps a single round robin sequence for predictable request distribution.
worker_processes 1;

events {
    worker_connections 4096;
}

# Requests without a session cookie use round robin routing. Browser sessions stay on one server because consent uses process memory across requests.
http {
    # The access log says which server answered.
    log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /dev/stdout upstream;

    upstream wallets {
        server wallet-1:8085;
        server wallet-2:8085;
    }

    upstream wallets_sticky {
        hash $cookie_eudi_session consistent;
        server wallet-1:8085;
        server wallet-2:8085;
    }

    map $cookie_eudi_session $pool {
        "" wallets;
        default wallets_sticky;
    }

    server {
        listen 8080;
        client_max_body_size 8m;

        location / {
            # Expose the selected server for load distribution checks.
            add_header X-Upstream $upstream_addr always;
            proxy_pass http://$pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}

# Both wallets share a TLS certificate, so HTTPS connections can reach either server.
stream {
    upstream wallets_tls {
        server wallet-1:8086;
        server wallet-2:8086;
    }

    server {
        listen 8081;
        proxy_pass wallets_tls;
    }
}
