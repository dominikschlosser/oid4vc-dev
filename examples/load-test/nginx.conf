# One worker keeps one round-robin state, so consecutive requests visit the
# servers in turn. It handles far more requests than two wallets do.
worker_processes 1;

events {
    worker_connections 4096;
}

# HTTP: the wallet API and UI. A request without a wallet session cookie (a
# load generator, a verifier, a CLI) goes round robin. A browser carrying the
# eudi_session cookie stays on one server, since a consent flow spans several
# requests that share in-memory state.
http {
    # The access log says which server answered.
    log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /dev/stdout upstream;

    upstream wallets {
        server wallet-1:8085;
        server wallet-2:8085;
    }

    upstream wallets_sticky {
        hash $cookie_eudi_session consistent;
        server wallet-1:8085;
        server wallet-2:8085;
    }

    map $cookie_eudi_session $pool {
        "" wallets;
        default wallets_sticky;
    }

    server {
        listen 8080;
        client_max_body_size 8m;

        location / {
            # Which server answered, for anyone checking the distribution.
            add_header X-Upstream $upstream_addr always;
            proxy_pass http://$pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}

# HTTPS issuer endpoints (issuer metadata, status list, registrar dataset).
# Both servers hold the same TLS certificate, so the TCP stream can go to
# either.
stream {
    upstream wallets_tls {
        server wallet-1:8086;
        server wallet-2:8086;
    }

    server {
        listen 8081;
        proxy_pass wallets_tls;
    }
}
